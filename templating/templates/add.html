{% extends "base.html" %}
{% block title %}Добавление — SMART TRAFFIC{% endblock %}

{% block content %}
<div class="page add-page">
    <div class="draft-badge">ЧЕРНОВИК</div>

    <form class="add-form" method="get" action="/add">
        <section class="form-section">
            <h3 class="section-label">МЕДИА</h3>

            <div class="upload-field">
                <span class="field-label">ИЗОБРАЖЕНИЕ УСТРОЙСТВА</span>
                <div class="upload-box upload-box-img">
                    <span class="upload-icon" aria-hidden="true">
                        <svg viewBox="0 0 48 48">
                            <rect x="6" y="6" width="36" height="36" rx="4"></rect>
                            <circle cx="17" cy="17" r="3"></circle>
                            <path d="M6 35L16 25L23 32L29 26L42 39"></path>
                        </svg>
                    </span>
                    <span class="upload-text">Добавить изображение</span>
                </div>
            </div>

            <div class="upload-field">
                <span class="field-label">ВИДЕО УСТРОЙСТВА</span>
                <div class="upload-box upload-box-video">
                    <span class="upload-icon" aria-hidden="true">
                        <svg viewBox="0 0 48 48">
                            <rect x="5" y="12" width="28" height="24" rx="4"></rect>
                            <path d="M33 20L43 14V34L33 28V20Z"></path>
                        </svg>
                    </span>
                    <span class="upload-text">Добавить короткое видео</span>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h3 class="section-label">ИНФОРМАЦИЯ</h3>

            <label>НАЗВАНИЕ УСТРОЙСТВА
                <input type="text" name="title" placeholder="Введите название" value="">
            </label>

            <label>МОДЕЛЬ
                <input type="text" name="model" placeholder="Введите модель" value="">
            </label>

            <label>ОПИСАНИЕ
                <textarea name="description" placeholder="Кратко опишите устройство" rows="3"></textarea>
            </label>
        </section>

        <section class="form-section">
            <h3 class="section-label">ПАРАМЕТРЫ ТРАФИКА</h3>

            <label>МАТЕМАТИЧЕСКОЕ ОЖИДАНИЕ E(X), ГБ/МЕС
                <input type="number" step="0.01" name="traffic_mean" placeholder="15" value="">
            </label>

            <label>ДИСПЕРСИЯ D(X), ГБ²
                <input type="number" step="0.01" name="traffic_variance" placeholder="4.2" value="">
            </label>
        </section>

    </form>
</div>
{% endblock %}
